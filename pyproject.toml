[project]
name = "farmverse"
version = "0.1.0"
description = "FarmVerse: isometric pixel-art precision-agriculture simulator over real fields, Sentinel-2 NDVI and weather computed on Fused or on this Mac, crop water-balance simulation in Python, DuckDB state."
