<!doctype html>
<html lang="en" data-fused-theme="shell">
<head>
<meta charset="utf-8">
<meta name="fused-app" />
<meta name="fused-api-version" content="1" />
<meta name="fused-app-id" content="farmverse-45dd198c" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmVerse</title>
<style>
:root {
  color-scheme: dark;
  --bg: var(--fused-bg, #121810); --surface: var(--fused-bg-panel, #1b2418); --surface-2: var(--fused-bg-alt, #243020);
  --line: var(--fused-border, #34432e); --hair: var(--fused-border, #2a3626);
  --ink: var(--fused-fg, #e9efe0); --muted: var(--fused-fg-muted, #a9b79c); --faint: var(--fused-fg-faint, #76856b);
  --accent: #f2c230; --on-accent: #1d2616; --accent-2: #5fb24a; --danger: #e0643f; --water: #4f9bd6;
  --sun: #f2c230; --cloud: #c9d3c0; --rain: #4f9bd6;
  --glass: rgba(27, 36, 24, 0.97); --scrim: rgba(8, 12, 7, 0.55);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --pixel: "Silkscreen", ui-monospace, Menlo, monospace;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --gap: 12px; --pad-h: 0px; --wx-bottom: 68px; --sw: 230px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: var(--fused-bg, #eef2e4); --surface: var(--fused-bg-panel, #fbfcf6); --surface-2: var(--fused-bg-alt, #eef3e3);
  --line: var(--fused-border, #cfd9c0); --hair: var(--fused-border, #dde5d0);
  --ink: var(--fused-fg, #1d2616); --muted: var(--fused-fg-muted, #5a6a4e); --faint: var(--fused-fg-faint, #8a9a7c);
  --accent: #b98a00; --on-accent: #fffbe8; --accent-2: #3f8f3a; --danger: #c24d2a; --water: #2f78b3;
  --sun: #d79a00; --cloud: #7d8b72; --rain: #2f78b3;
  --glass: rgba(251, 252, 246, 0.98); --scrim: rgba(29, 38, 22, 0.35);
  --shadow: 0 12px 32px rgba(29, 38, 22, 0.16);
}
.hud {
  color-scheme: dark;
  --surface: #1b2418; --surface-2: #26331f; --line: #3a4a32; --hair: #2c3828;
  --ink: #eef3e6; --muted: #b0bea3; --faint: #7d8c72;
  --accent: #f2c230; --on-accent: #1d2616; --accent-2: #6cc254; --danger: #ec7550; --water: #5aa6e0;
  --sun: #f6c843; --cloud: #cfd8c6; --rain: #5aa6e0;
  --glass: rgba(20, 27, 18, 0.88); --shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  color: var(--ink);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
::placeholder { color: var(--muted); opacity: 1; }
input, select, textarea { accent-color: var(--accent, currentColor); }
img, svg, video, canvas { display: block; max-width: 100%; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--sans); }
.hidden { display: none !important; }
kbd { font: 600 10.5px/1 var(--mono); padding: 2px 5px; border-radius: 4px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); color: inherit; opacity: 0.85; }

#app { position: fixed; inset: 0; overflow: hidden; background: #0e140c; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.panel { background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 12.5px; white-space: nowrap; min-width: 0; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .link:focus-visible, .x:focus-visible, .seg button:focus-visible, #chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.45; cursor: default; filter: none; }
.link { color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line); }
.link:hover { color: var(--ink); }
.x { flex: none; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; }
.x.lg { width: 32px; height: 32px; font-size: 19px; }
.x.sm { width: 26px; height: 26px; border-radius: 7px; font-size: 16px; }
.x:hover { background: var(--surface-2); color: var(--ink); }
.seg { display: inline-flex; flex-wrap: wrap; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.seg.float { position: absolute; left: 10px; top: 10px; z-index: 2; flex-wrap: nowrap; background: var(--surface); box-shadow: var(--shadow); }
.seg button { height: 28px; padding: 0 11px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }
.seg button[disabled] { opacity: 0.6; cursor: default; }
.seg.sm button { height: 24px; padding: 0 10px; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; } .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.scrim { position: absolute; inset: 0; z-index: 50; background: var(--scrim); animation: fv-fade 0.2s ease-out; }
.lbl, #drawer h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--faint); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.days > div { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 8px; min-width: 0; }
.days > div > span { font-size: 11px; font-weight: 600; color: var(--muted); }
.days b { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.days small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.days em { font-style: normal; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.days em.wet { color: var(--water); font-weight: 600; }

#topl { position: absolute; left: calc(var(--gap) + var(--sl)); top: calc(var(--gap) + var(--st)); display: flex; gap: 8px; align-items: center; max-width: calc(100% - var(--wx-w, 460px) - 2 * var(--gap) - 8px - var(--sl) - var(--sr)); min-width: 0; }
#chip { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 10px; text-align: left; min-width: 0; }
#chip .logo { width: 26px; height: 26px; flex: none; border-radius: 7px; background: var(--accent-2); display: grid; place-items: center; color: #12200e; font: 700 13px/1 var(--pixel); }
#chip .ct { min-width: 0; display: flex; flex-direction: column; }
#chip .ct b { font: 700 14px/1.15 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chip .ct span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chip .caret { color: var(--muted); font-size: 11px; flex: none; }

#wx { position: absolute; right: calc(var(--gap) + var(--sr)); top: calc(var(--gap) + var(--st)); }
#dayctl.flash .day { animation: fv-flash 1.1s ease-out; }
@keyframes fv-flash { 0%, 35% { color: var(--accent); } 100% { color: inherit; } }

#stats { position: absolute; right: calc(var(--gap) + var(--sr)); bottom: calc(var(--gap) + var(--sb) + var(--pad-h)); display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 5px; }
#data-btn, #base-btn { height: 32px; padding: 0 11px; flex: none; }
#data-btn svg, #base-btn svg { width: 16px; height: 16px; }
#data-btn.on, #base-btn[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
#base-btn.wait svg { animation: fv-blink 1s steps(2) infinite; }
#credit { position: absolute; right: calc(var(--gap) + var(--sr)); bottom: calc(var(--sb) + var(--pad-h)); font-size: 9.5px; line-height: 11px; color: rgba(238, 243, 230, 0.7); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); pointer-events: none; white-space: nowrap; }

#cardwrap { position: absolute; left: var(--cl, var(--sw)); right: var(--cr, var(--sw)); bottom: calc(var(--cb, var(--gap)) + var(--sb) + var(--pad-h)); display: flex; justify-content: center; pointer-events: none; transition: left 0.3s ease, right 0.3s ease, bottom 0.3s ease; }
#cardwrap > * { pointer-events: auto; }
#toasts { position: absolute; left: 50%; top: calc(var(--gap) + var(--st) + 56px); transform: translateX(-50%); width: min(420px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 40; }
.toast { pointer-events: auto; max-width: 100%; padding: 8px 12px 8px 10px; border-radius: 10px; font-size: 12.5px; display: flex; align-items: flex-start; gap: 8px; animation: fv-pop 0.22s ease-out; }
.toast::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.toast.warn::before { background: var(--danger); } .toast.good::before { background: var(--accent-2); } .toast.info::before { background: var(--water); }
@keyframes fv-pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fv-rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fv-fade { from { opacity: 0; } to { opacity: 1; } }

.tip { position: absolute; z-index: 5; pointer-events: none; min-width: 120px; padding: 6px 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 11.5px; color: var(--ink); }
.tip .th { color: var(--muted); margin-bottom: 3px; white-space: nowrap; }
.tip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; } .tip .tr b { font-variant-numeric: tabular-nums; } .tip .tr span { color: var(--muted); }
.tip .tr i { width: 10px; height: 2px; border-radius: 1px; flex: none; }

#loading { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(10, 14, 9, 0.72); padding: 16px; }
#loading .lc { width: min(400px, 100%); padding: 20px 22px; }
#loading .lt { font: 700 15px/1.3 var(--pixel); color: var(--accent); letter-spacing: 1px; }
#loading .lsub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
#loading ol { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 7px; }
#loading li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13px; color: var(--muted); }
#loading li i { font-style: normal; text-align: center; }
#loading li.work { color: var(--ink); } #loading li.work i { color: var(--accent); animation: fv-blink 1s steps(2) infinite; }
#loading li.done i { color: var(--accent-2); } #loading li.skip { color: var(--faint); } #loading li.fail { color: var(--danger); }
#loading li small { display: block; color: var(--faint); font-size: 11.5px; }
#loading .lerr { margin-top: 12px; font-size: 12.5px; color: var(--danger); }
#loading .lact { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
@keyframes fv-blink { 50% { opacity: 0.3; } }

#preview { position: absolute; inset: 0; display: grid; place-items: center; background: #1b2418; color: #e9efe0; text-align: center; }
#preview h1 { margin: 0; font: 700 30px/1.2 var(--pixel); color: #f2c230; letter-spacing: 2px; } #preview h1 span { color: #5fb24a; }
#preview p { margin: 8px 0 0; color: #a9b79c; }

#app.pop-open { --cl: 336px; }
@media (min-width: 960px) { #app.drawer-open { --cr: 456px; } }
@media (max-width: 1199px) { #app.pop-open.drawer-open #cardwrap { display: none; } }
@media (min-width: 860px) and (max-width: 1199px) {
  #app { --cl: var(--gap); --cr: var(--sw); }
  #cardwrap { justify-content: flex-start; }
  #app.pop-open { --cl: 336px; --cr: var(--gap); --cb: 66px; }
}
@media (min-width: 600px) and (max-width: 859px) {
  #app, #app.drawer-open { --cl: var(--gap); --cr: calc(var(--st-w, 190px) + 2 * var(--gap) + var(--sr)); --cb: var(--gap); }
  #cardwrap { justify-content: flex-start; }
  #app.pop-open #cardwrap { display: none; }
  #dayctl .day span { display: none; }
}
#app.touch { --pad-h: 150px; }
@media (max-width: 599px) {
  #app { --gap: 10px; --cl: var(--gap); --cr: var(--gap); --cb: 10px; }
  #app.pop-open, #app.drawer-open { --cl: var(--gap); --cr: var(--gap); }
  #topl { gap: 6px; }
  #chip { height: 42px; padding: 0 10px 0 8px; gap: 8px; }
  #chip .logo { width: 22px; height: 22px; font-size: 11px; }
  #chip .ct b { font-size: 13px; }
  #stats { top: calc(var(--gap) + var(--st) + 50px); bottom: auto; height: 40px; padding: 0 4px; }
  #data-btn, #base-btn { height: 30px; padding: 0 8px; } #data-btn span, #base-btn span { display: none; }
  #credit { bottom: 0; font-size: 9px; line-height: 10px; }
  #app.touch #stats { bottom: auto; }
  #toasts { top: calc(var(--gap) + var(--st) + 100px); }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="Farm world"></canvas>
  <div id="hud" class="hud">
    <div id="topl">
      <button id="chip" class="panel" aria-haspopup="menu" aria-label="Farm menu"><span class="logo">FV</span><span class="ct"><b id="farm-title">FarmVerse</b><span id="farm-sub">Loading farm</span></span><span class="caret">▾</span></button>
    </div>
    <div id="wx" class="panel">
      <div class="bar">
        <button class="now" id="wx-now" aria-expanded="false" aria-controls="wx-more" title="Weather and the next 7 days"></button>
        <div id="dayctl"><button class="btn chev" id="back7" title="Back a week" aria-label="Go back seven days">«</button><button class="btn chev" id="back1" title="Back a day" aria-label="Go back one day">‹</button><button class="day" id="day-btn" aria-haspopup="dialog" aria-expanded="false" title="Season calendar (C)"><b id="day-lab">—</b><span id="day-sub">day 0</span></button><button class="btn chev" id="adv1" title="Next day (Enter)" aria-label="Advance one day">›</button><button class="btn chev" id="adv7" title="Skip a week" aria-label="Advance seven days">»</button></div>
      </div>
      <div class="more hidden" id="wx-more"></div>
    </div>
    <div id="stats" class="panel">
      <button id="base-btn" class="btn" aria-pressed="false" title="Real satellite imagery as the ground (B)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l7 3.5-7 3.5-7-3.5z"/><path d="M3 10.2l7 3.5 7-3.5M3 13.7l7 3.5 7-3.5"/></svg><span>Satellite</span></button>
      <button id="data-btn" class="btn" title="Data drawer (2)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 16.5h14M5.5 13.5v-4M10 13.5v-8M14.5 13.5v-6"/></svg><span>Data</span></button>
    </div>
    <div id="credit" class="hidden"></div>
    <div id="cardwrap"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <div id="loading" class="hud"><div class="lc panel"><div class="lt">FARMVERSE</div><div class="lsub" id="loading-sub">Opening your farm</div><ol id="loading-steps"></ol><div class="lerr hidden" id="loading-err"></div><div class="lact" id="loading-act"></div></div></div>
</div>

<script>
(function () {
  function isPreview() {
    if (new URLSearchParams(location.search).get("_preview") === "1") return true;
    try { let w = window; while (w.parent && w.parent !== w) { w = w.parent; if (new URLSearchParams(w.location.search).get("_preview") === "1") return true; } } catch (e) {}
    return false;
  }
  if (isPreview()) {
    document.getElementById("app").innerHTML = '<div id="preview"><div><h1>FARM<span>VERSE</span></h1><p>Drive a tractor over real fields, read Sentinel-2 and decide when to irrigate</p></div></div>';
    return;
  }
  const raw = (p) => (window.fused && fused.rawUrl) ? fused.rawUrl(p) : p;
  const MODS = ["app.js", "engine.js", "sprites.js", "charts.js", "sound.js",
    "ui/util.js", "ui/basemap.js", "ui/weather.js", "ui/calendar.js", "ui/realmap.js", "ui/card.js", "ui/tour.js", "ui/popover.js", "ui/outlook.js", "ui/drawer.js", "ui/picker.js", "ui/pad.js", "ui/menu.js", "ui/loader.js", "ui/account.js", "ui/feed.js"];
  const abs = (p) => new URL(raw("src/" + p), location.href).href;
  const dir = (p) => p.slice(0, p.lastIndexOf("/") + 1);
  const rel = (from, to) => { const d = dir(from); if (!d) return "./" + to; return to.startsWith(d) ? "./" + to.slice(d.length) : "../" + to; };
  const imports = {};
  for (const from of MODS) for (const to of MODS) {
    if (from === to) continue;
    const key = new URL(rel(from, to), abs(from)).href;
    if (!(key in imports)) imports[key] = abs(to);
    else if (imports[key] !== abs(to)) console.warn("FarmVerse import map: key clash for", key);
  }
  const map = document.createElement("script"); map.type = "importmap"; map.textContent = JSON.stringify({ imports });
  document.head.appendChild(map);
  const link = document.createElement("link"); link.rel = "stylesheet"; link.href = "https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"; document.head.appendChild(link);
  import(abs("app.js")).catch((err) => {
    console.error(err);
    const l = document.getElementById("loading");
    l.querySelector(".lt").textContent = "FAILED TO LOAD"; l.querySelector(".lsub").textContent = err.message;
  });
})();
</script>
</body>
</html>
